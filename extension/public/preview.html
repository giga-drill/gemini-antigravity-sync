<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Chat Preview</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #0f172a;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    #toolbar {
      position: sticky;
      top: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid #e2e8f0;
      backdrop-filter: blur(6px);
    }

    #btn-export-pdf {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }

    #btn-export-pdf[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #chat-container {
      width: min(960px, 100%);
      margin: 16px auto;
      padding: 20px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 6px 24px rgba(2, 6, 23, 0.08);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <div>Gemini 聊天预览</div>
    <button id="btn-export-pdf" type="button">导出为 PDF</button>
  </div>

  <div id="chat-container"></div>

  <script src="preview.js"></script>
</body>
</html>
